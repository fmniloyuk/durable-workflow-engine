name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Static analysis
        run: mypy backend/app
      - name: Unit tests
        run: pytest -q backend/tests/unit
      - name: Property-based tests
        run: pytest -q -m property backend/tests/property
      - name: Recovery model tests
        run: pytest -q -m chaos backend/tests/chaos

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workflow
          POSTGRES_USER: workflow
          POSTGRES_PASSWORD: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workflow -d workflow"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://workflow:workflow@localhost:5432/workflow
      REDIS_URL: redis://localhost:6379/0
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Migrate
        run: alembic -c backend/alembic.ini upgrade head
      - name: Integration tests
        run: pytest -q -m integration backend/tests/integration

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install
      - name: Dump generated lockfile
        run: cat package-lock.json
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build api worker scheduler web

  chaos-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run destructive recovery scenarios
        run: ./scripts/chaos-compose.sh
      - name: Capture logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 || true
