name: durable-workflow-engine

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://workflow:workflow@postgres:5432/workflow
  REDIS_URL: redis://redis:6379/0
  LEASE_SECONDS: "10"
  HEARTBEAT_SECONDS: "3"
  OUTBOX_POLL_SECONDS: "0.5"
  SCHEDULER_POLL_SECONDS: "1"
  QUEUE_PARTITIONS: "4"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redis-data:/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
      SERVICE_NAME: durable-workflow-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
      SERVICE_NAME: durable-workflow-worker
      WORKER_ID: worker-1
      WORKER_QUEUES: billing,email,analytics,default
      WORKER_CONCURRENCY: "8"
      METRICS_PORT: "9101"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.worker"]
    ports: ["127.0.0.1:9101:9101"]

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-env
      SERVICE_NAME: durable-workflow-scheduler
      METRICS_PORT: "9102"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.scheduler"]
    ports: ["127.0.0.1:9102:9102"]

  web:
    build:
      context: web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api, worker, scheduler]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro

volumes:
  postgres-data:
  redis-data:
